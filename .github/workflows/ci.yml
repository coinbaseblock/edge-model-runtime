name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shopt -s globstar nullglob
          shellcheck -x scripts/lib/common.sh scripts/*.sh

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose with both env files
        run: |
          cp .env.example .env
          sed -i 's|^WEBUI_SECRET_KEY=$|WEBUI_SECRET_KEY=ci-test-key|' .env
          docker compose --env-file .env --env-file .env.versions config > /dev/null

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No chmod 777
        run: |
          # Match real chmod 777 invocations (line not starting with #).
          if grep -RnE '^[[:space:]]*[^#]*chmod[[:space:]]+(-[A-Za-z]+[[:space:]]+)?777' scripts/; then
            echo "FAIL: chmod 777 found"; exit 1
          fi
      - name: No latest/main tags in .env.versions
        run: |
          if grep -E '^[A-Z_]+_IMAGE=.*:(latest|main)$' .env.versions; then
            echo "FAIL: unpinned tag in .env.versions"; exit 1
          fi
      - name: 20-wipe-models.sh still requires DELETE ALL
        run: grep -q "DELETE ALL" scripts/20-wipe-models.sh
