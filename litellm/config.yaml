# =============================================================================
# litellm/config.yaml — LiteLLM proxy model registry
# =============================================================================
model_list:

  # --- Anthropic Claude (paid — ANTHROPIC_API_KEY in .env) -------------------
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- OpenAI ChatGPT (paid — OPENAI_PROVIDER_API_KEY in .env) ---------------
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  # --- Local Ollama models (DGX Spark / GB10, 128 GB unified memory) ---------

  # qwen2.5-coder family
  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: qwen2.5-coder-14b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: qwen2.5-coder-32b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # qwen3-coder family (agentic coding)
  - model_name: qwen3-coder
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: qwen3-coder-32k
    litellm_params:
      model: ollama_chat/qwen3-coder-32k:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: qwen3-coder-next
    litellm_params:
      model: ollama_chat/qwen3-coder-next:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # qwen3.6 dense 27B
  - model_name: qwen3.6-27b
    litellm_params:
      model: ollama_chat/qwen3.6:27b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # gemma4 vision family
  - model_name: gemma4
    litellm_params:
      model: ollama_chat/gemma4:26b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: gemma4-32k
    litellm_params:
      model: ollama_chat/gemma4-32k:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # qwen2.5-vl vision-language
  - model_name: qwen2.5vl
    litellm_params:
      model: ollama_chat/qwen2.5vl:7b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: qwen2.5vl-32k
    litellm_params:
      model: ollama_chat/qwen2.5vl-32k:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # localmodel26b (custom fine-tune)
  - model_name: localmodel26b
    litellm_params:
      model: ollama_chat/localmodel26b:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: localmodel26b-32k
    litellm_params:
      model: ollama_chat/localmodel26b-32k:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # deepseek-coder-v2 (coding)
  - model_name: deepseek-coder
    litellm_params:
      model: ollama_chat/deepseek-coder-v2:16b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # gpt-oss (OpenAI open-weights via Ollama)
  - model_name: gpt-oss
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # nemotron family (NVIDIA)
  - model_name: nemotron
    litellm_params:
      model: ollama_chat/nemotron:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  - model_name: nemotron-nano
    litellm_params:
      model: ollama_chat/nemotron-3-nano:latest
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # llama3
  - model_name: llama3
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 3600
      stream_timeout: 3600

  # --- LM Studio (host desktop app, optional) --------------------------------
  - model_name: lmstudio
    litellm_params:
      model: os.environ/LMSTUDIO_MODEL
      api_base: os.environ/LMSTUDIO_BASE_URL
      api_key: os.environ/LMSTUDIO_API_KEY
      custom_llm_provider: openai

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 21600
  stream_timeout: 21600

general_settings:
  max_request_timeout: 21600