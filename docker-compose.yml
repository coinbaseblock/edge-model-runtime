# =============================================================================
# edge-model-runtime — Docker Compose
# =============================================================================
# Loads two env files at runtime:
#   .env            (paths, ports, runtime tunables, secrets)
#   .env.versions   (pinned image tags)
#
# Run with: docker compose --env-file .env --env-file .env.versions <cmd>
# Or use:   bash scripts/01-start.sh
# =============================================================================

name: edge-model-runtime

services:

  # ---------------------------------------------------------------------------
  # CORE: Ollama inference server
  # ---------------------------------------------------------------------------
  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: edge-ollama
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

    # Bind-mount host directory into container.
    # Models persist on host — container can be rebuilt freely.
    volumes:
      - ${AI_DATA_ROOT}/ollama:/root/.ollama

    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - edge-ai-net

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # CORE: Open WebUI
  # ---------------------------------------------------------------------------
  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: edge-open-webui
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "${WEBUI_PORT:-3000}:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${WEBUI_DEFAULT_USER_ROLE:-pending}

    volumes:
      - ${AI_DATA_ROOT}/open-webui:/app/backend/data

    networks:
      - edge-ai-net

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # OPTIONAL: vLLM (HuggingFace, faster inference)
  # Enable: docker compose --profile vllm up -d vllm
  # ---------------------------------------------------------------------------
  vllm:
    image: ${VLLM_IMAGE}
    container_name: edge-vllm
    profiles: ["vllm"]
    restart: unless-stopped

    ports:
      - "${VLLM_PORT:-8000}:8000"

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

    volumes:
      - ${AI_DATA_ROOT}/hf-cache:/root/.cache/huggingface

    command:
      - --host=0.0.0.0
      - --port=8000
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization=${VLLM_GPU_MEM_UTIL:-0.90}

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - edge-ai-net

  # ---------------------------------------------------------------------------
  # OPTIONAL: Training (PyTorch interactive shell)
  # Enable: docker compose --profile training run --rm training bash
  # ---------------------------------------------------------------------------
  training:
    image: ${TRAINING_IMAGE}
    container_name: edge-training
    profiles: ["training"]
    restart: "no"

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

    volumes:
      - ${AI_DATA_ROOT}/training:/workspace/training
      - ${AI_DATA_ROOT}/hf-cache:/root/.cache/huggingface
      - ./training:/workspace/scripts:ro

    working_dir: /workspace/training

    command: bash
    stdin_open: true
    tty: true
    ipc: host

    ports:
      - "${TENSORBOARD_PORT:-6006}:6006"
      - "${JUPYTER_PORT:-8888}:8888"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - edge-ai-net

networks:
  edge-ai-net:
    name: edge-ai-net
    driver: bridge
